# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # npm workspaces share the root package-lock.json, so the root directory
  # covers every package.json under packages/*.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait before proposing new releases so compromised or broken versions
    # have time to be caught and pulled from the registry.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - "dependencies"
    ignore:
      # A Storybook major needs `npx storybook upgrade` to run its codemods
      # against .storybook/main.ts, addon registration and story syntax.
      # Dependabot can only move version ranges, so a grouped major bump lands
      # without the migration and fails `npm run test:storybook`. Majors are
      # done by hand; the storybook group below still batches minor and patch.
      - dependency-name: "storybook"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-storybook"
        update-types: ["version-update:semver-major"]
    groups:
      # Storybook packages must stay on matching versions.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
