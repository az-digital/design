name: Create release
run-name: ${{ inputs.action == 'prepare' && 'Prepare' || 'Publish' }} v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a version-bump PR or publish the merged version
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish
      version:
        description: Version to prepare or publish
        required: true
        type: string
      prerelease:
        description: Create a prerelease (publish action only)
        required: false
        default: false
        type: boolean
      make_latest:
        description: Make this the latest release (publish action only; false for prereleases)
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  create-release:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check workflow is running from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch"
            exit 1
          fi

      - name: Prepare version-bump branch
        if: ${{ inputs.action == 'prepare' }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          branch="release/v${VERSION}"

          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null; then
            echo "::error::Release branch ${branch} already exists"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Release tag v${VERSION} already exists"
            exit 1
          fi

          git switch --create "$branch"
          npm pkg set "version=${VERSION}" --workspaces --include-workspace-root

          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';

          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          if (root.version !== process.env.VERSION) {
            throw new Error(`Root package version ${root.version} does not match ${process.env.VERSION}`);
          }
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          lock.version = root.version;
          lock.packages[''].version = root.version;

          const packages = readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .filter((entry) => existsSync(`packages/${entry.name}/package.json`))
            .map((entry) => {
              const pkg = JSON.parse(readFileSync(`packages/${entry.name}/package.json`, 'utf8'));
              const lockEntry = lock.packages[`packages/${entry.name}`];
              if (pkg.version !== root.version || !lockEntry) {
                throw new Error(`${pkg.name} version or package-lock entry does not match ${root.version}`);
              }
              lockEntry.version = pkg.version;
              return pkg;
            });

          for (const pkg of packages) {
            if (pkg.version !== root.version) {
              throw new Error(`${pkg.name} version ${pkg.version} does not match ${root.version}`);
            }
          }
          writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: prepare release v${VERSION}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="$auth_header" \
            git push origin "$branch"

      - name: Open version-bump pull request
        if: ${{ inputs.action == 'prepare' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${VERSION}" \
            --title "chore: prepare release v${VERSION}" \
            --body "Updates the root and workspace package versions to ${VERSION}. This PR is set to auto-merge when branch-protection requirements pass. After it merges, run the Create release workflow with action=publish."
          gh pr merge "release/v${VERSION}" --auto --merge --delete-branch

      - name: Validate release inputs
        if: ${{ inputs.action == 'publish' }}
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';

          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.VERSION !== root.version) {
            throw new Error(`Requested version ${process.env.VERSION} must match root package.json version ${root.version}`);
          }
          if (process.env.PRERELEASE === 'true' && process.env.MAKE_LATEST === 'true') {
            throw new Error('A prerelease cannot be marked as the latest release');
          }

          const packages = readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .filter((entry) => existsSync(`packages/${entry.name}/package.json`))
            .map((entry) => JSON.parse(readFileSync(`packages/${entry.name}/package.json`, 'utf8')))
            .filter((pkg) => pkg.name?.startsWith('@az-digital/') && !pkg.private);

          if (packages.length === 0) {
            throw new Error('No publishable @az-digital packages were found');
          }

          for (const pkg of packages) {
            if (pkg.version !== root.version) {
              throw new Error(`${pkg.name} version ${pkg.version} must match root package.json version ${root.version}`);
            }
          }
          NODE

      - name: Check release tag does not already exist
        if: ${{ inputs.action == 'publish' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag_refs=$(git ls-remote origin "refs/tags/v${VERSION}")
          if [ -n "$tag_refs" ]; then
            echo "::error::Release tag v${VERSION} already exists"
            exit 1
          fi

      - name: Create GitHub release
        if: ${{ inputs.action == 'publish' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ inputs.version }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
