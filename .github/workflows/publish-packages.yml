name: Publish npm packages
run-name: Publish npm packages for ${{ github.event.release.tag_name }}

on:
  release:
    types:
      - published

jobs:
  publish-packages:
    name: Publish packages to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository to workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@az-digital'

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/validate-release.mjs

      - name: Build publishable packages
        run: npm run build:tokens && npm run build:contracts

      - name: Check packed packages and consumer imports
        run: npm run check:package-artifacts

      - name: Publish all public workspaces
        run: npm publish --workspaces --tag "$NPM_DIST_TAG" --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
