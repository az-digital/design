name: Build & deploy review site

on:
  pull_request:
  push:
    branches:
      - main

env:
  AZ_SITE_HOST: ${{ vars.AZ_SITE_HOST }}

jobs:
  lint-code:
    name: Check code for linting errors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository to workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint:storybook

      - name: Run Storybook tests
        run: npm run test:storybook
  review-site:
    name: Build & deploy review site
    needs: lint-code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository to workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build review site path for pushes
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          SAFE_REF=$(echo "${GITHUB_REF#refs/*/}" | tr '/' '-')
          echo "AZ_REVIEW_BASEURL=/design/${SAFE_REF}" >> "${GITHUB_ENV}"

      - name: Build review site path for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "AZ_REVIEW_BASEURL=/design/pr-${{ github.event.pull_request.number }}" >> "${GITHUB_ENV}"

      - name: Build Storybook
        run: npm run build:storybook

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy review site artifact to S3 + CloudFront
        run: |
          aws s3 sync --delete packages/storybook/storybook-static/ "s3://${{ secrets.REVIEW_BUCKET }}${AZ_REVIEW_BASEURL}/"
          aws cloudfront create-invalidation --distribution-id "${{ secrets.REVIEW_CDN }}" --paths "${AZ_REVIEW_BASEURL}/*"

      - name: Comment review site URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const marker = '<!-- design-review-site -->';
            const body = `${marker}
            Review site: ${process.env.AZ_SITE_HOST}${process.env.AZ_REVIEW_BASEURL}/`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Display review site URL
        run: |
          echo "Review site deployed to ${AZ_SITE_HOST}${AZ_REVIEW_BASEURL}/"
