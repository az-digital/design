<!-- Proxima Nova, the brand typeface Arizona Bootstrap's styles expect. -->
<link href="https://use.typekit.net/sgx0zzg.css" rel="stylesheet" crossorigin="anonymous">
<!--
  Material Symbols Rounded, for the icons in Arizona Bootstrap markup (such as
  the header buttons). It loads FILL from 0 to 1 and weights 300 to 400, so an
  example can show an outline icon (font-variation-settings: "FILL" 0) at a
  light weight (.fw-light), as the icon card example does.
-->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..400,0..1,0" rel="stylesheet">
<!-- Arizona Icons, for the social media icons in the call to action card example. -->
<link href="https://cdn.digital.arizona.edu/lib/az-icons/main/az-icons-styles.css" rel="stylesheet">
<!-- Keep every other icon filled, the same as a site that loads only the filled icons. -->
<style>
  .material-symbols-rounded {
    font-variation-settings: "FILL" 1;
  }
</style>
<!--
  Arizona Bootstrap, pinned, so Arizona Bootstrap markup in Storybook renders
  with its real CSS and JavaScript (the JavaScript runs data-bs-* behavior
  such as the header's off-canvas menu). arizona-bootstrap-shim.css, imported
  in preview.ts, then points its styles at our tokens.
-->
<link rel="stylesheet" href="https://cdn.digital.arizona.edu/lib/arizona-bootstrap/5.2.2/css/arizona-bootstrap.css" />
<script defer src="https://cdn.digital.arizona.edu/lib/arizona-bootstrap/5.2.2/js/arizona-bootstrap.bundle.min.js"></script>
