<!-- Proxima Nova, the brand typeface Arizona Bootstrap's styles expect. -->
<link href="https://use.typekit.net/sgx0zzg.css" rel="stylesheet" crossorigin="anonymous">
<!--
  Material Symbols Rounded, for the icons in Arizona Bootstrap markup (such as
  the header buttons). It loads FILL from 0 to 1 and weights 300 to 400, so an
  example can show an outline icon (font-variation-settings: "FILL" 0) at a
  light weight (.fw-light), as the icon card example does.
-->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..400,0..1,0" rel="stylesheet">
<!-- Keep every other icon filled, the same as a site that loads only the filled icons. -->
<style>
  .material-symbols-rounded {
    font-variation-settings: "FILL" 1;
  }
</style>
